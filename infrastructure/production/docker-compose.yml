name: health-directory

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]

  api:
    build:
      context: ../..
      dockerfile: infrastructure/production/Dockerfile.api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-8000}
      DATABASE_SLOW_QUERY_MS: ${DATABASE_SLOW_QUERY_MS:-250}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      CORS_ORIGINS: https://admin.${APP_DOMAIN}
      APP_TIMEZONE: Asia/Damascus
      UPLOAD_DIR: /data/uploads
      WHATSAPP_RECOVERY_WEBHOOK_URL: ${WHATSAPP_RECOVERY_WEBHOOK_URL:-}
      WHATSAPP_RECOVERY_WEBHOOK_TOKEN: ${WHATSAPP_RECOVERY_WEBHOOK_TOKEN:-}
    volumes:
      - upload_data:/data/uploads
    networks: [backend,edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/production/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: https://api.${APP_DOMAIN}/api/v1
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.${APP_DOMAIN}/api/v1
    networks: [edge]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [api,admin]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  upload_data:
  caddy_data:
  caddy_config:
