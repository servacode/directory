services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: health_directory
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health_directory"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - health_pgdata:/var/lib/postgresql/data
volumes:
  health_pgdata:
